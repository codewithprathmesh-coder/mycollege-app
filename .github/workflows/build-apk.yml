name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./MyCollege_Project_Secured
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        working-directory: ./MyCollege_Project_Secured
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./MyCollege_Project_Secured
        run: npx cap sync android

      - name: Compile Android Debug APK
        working-directory: ./MyCollege_Project_Secured/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyCollege-App-APK
          path: ./MyCollege_Project_Secured/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
