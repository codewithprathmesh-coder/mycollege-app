name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Capacitor
        working-directory: ./MyCollege_Project_Secured
        run: |
          npm install
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0

      - name: Build Web Application
        working-directory: ./MyCollege_Project_Secured
        run: npm run build

      - name: Configure Capacitor Android
        working-directory: ./MyCollege_Project_Secured
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mycollege.app",
            "appName": "MyCollege",
            "webDir": "dist",
            "server": {
              "url": "https://mycollege-app.onrender.com",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compile Android Debug APK
        working-directory: ./MyCollege_Project_Secured/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MyCollege-Debug-APK
          path: ./MyCollege_Project_Secured/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
